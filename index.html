<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
   <link rel="stylesheet" href=" https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="color">
        <div class="main">
            <div class="icon">
                <span class="share"><i class="fa-solid fa-share-nodes"></i></span>
                <span class="heart"><i class="fa-regular fa-heart"></i></span>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDcbjb0UdbNCYrEC1UIqY8XQp3KO7sdhYpC5Y_zKYFJj6ctuzGZD8sgbM&s=10" alt="Strawberry">
            </div>
        </div>
        <div class="content">
            <h1>Delicious Strawberry</h1>
            <span class="rs">R$. 
            <span class="num">7.93</span>
            </span>
            <p>SELECT A FRUIT</p>
            <div class="fruit">
                <img class="str" src="https://plus.unsplash.com/premium_photo-1724256149016-05c013fe058e?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Strawberry">
                <img class="berry" src="https://plus.unsplash.com/premium_photo-1724849298406-be8ec5197218?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Blue Berry">
                <img class="Rberry" src="https://plus.unsplash.com/premium_photo-1724256067489-89d8d95f0b66?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Red Berry">
            </div>
            <p>BENEFITS:</p>
          <ul>
            <li>It boosts brain power</li>
            <li>It protects against cell damage</li>
            <li>It protects heart health</li>
        </ul>
        <button>ADD TO CARD</button>


        
            
        </div>
    </div>    
</body>
</html>
